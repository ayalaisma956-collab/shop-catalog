<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wholesale Parts Market Survey — Interactive Visual Catalog</title>
<style>
  :root {
    --bg: #0b1120;
    --card-bg: #172033;
    --card-hover: #1e293b;
    --border: #2e3c54;
    --text: #f8fafc;
    --muted: #94a3b8;
    --hot: #10b981;
    --hot-bg: rgba(16, 185, 129, 0.16);
    --med: #f59e0b;
    --med-bg: rgba(245, 158, 11, 0.16);
    --skip: #ef4444;
    --skip-bg: rgba(239, 68, 68, 0.14);
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 95px; }

  /* Sticky Top Header */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(11, 17, 32, 0.96); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); padding: 12px 16px 10px;
  }
  .top-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; max-width: 1340px; margin: 0 auto; }
  .title-box h1 { font-size: 1.15rem; font-weight: 800; color: #fff; letter-spacing: -0.2px; }
  .title-box p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn-ctrl {
    background: var(--card-bg); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
    cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ctrl.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-ctrl:hover { border-color: #64748b; }

  /* Category Tabs */
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px;
    max-width: 1340px; margin: 0 auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 8px 14px; border-radius: 999px;
    background: var(--card-bg); border: 1px solid var(--border);
    color: var(--muted); font-size: 0.82rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab .t-cnt {
    font-size: 0.72rem; padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,0.08); color: #cbd5e1;
  }
  .tab.active { background: #fff; color: #0f172a; border-color: #fff; }
  .tab.active .t-cnt { background: #0f172a; color: #fff; }

  /* Search & Filter Bar */
  .sub-bar {
    max-width: 1340px; margin: 12px auto 0; padding: 0 16px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .search-input {
    flex: 1; min-width: 220px; background: var(--card-bg); border: 1px solid var(--border);
    color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 0.88rem;
  }
  .stats-pills { display: flex; gap: 6px; flex-wrap: wrap; font-size: 0.78rem; font-weight: 700; }
  .stat-pill {
    padding: 7px 11px; border-radius: 8px; background: var(--card-bg);
    border: 1px solid var(--border); cursor: pointer; user-select: none;
  }
  .stat-pill.active-filter { outline: 2px solid #fff; }
  .stat-pill.hot { color: var(--hot); border-color: rgba(16,185,129,0.4); }
  .stat-pill.med { color: var(--med); border-color: rgba(245,158,11,0.4); }
  .stat-pill.skip { color: var(--skip); border-color: rgba(239,68,68,0.4); }
  .stat-pill.unrated { color: #38bdf8; border-color: rgba(56,189,248,0.4); }

  .container { max-width: 1340px; margin: 14px auto; padding: 0 16px; }

  /* Reference Visual Guide Banner */
  .ref-section {
    margin-bottom: 16px; background: rgba(30, 41, 59, 0.55); border: 1px dashed #475569;
    border-radius: 12px; padding: 12px 14px;
  }
  .ref-header {
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    font-size: 0.84rem; font-weight: 700; color: #cbd5e1;
  }
  .ref-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px; margin-top: 10px;
  }
  .ref-section.collapsed .ref-grid { display: none; }
  .ref-card {
    display: flex; align-items: center; gap: 10px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px;
  }
  .ref-card img {
    width: 68px; height: 68px; object-fit: contain; background: #fff;
    border-radius: 6px; padding: 3px; flex-shrink: 0; cursor: zoom-in;
  }
  .ref-card h4 { font-size: 0.8rem; color: #fff; margin-bottom: 3px; }
  .ref-card p { font-size: 0.72rem; color: var(--muted); line-height: 1.3; }
  body.hide-prices .ref-price-hint { display: none; }

  /* Grid Layout */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 16px;
  }

  /* Product Card */
  .card {
    background: var(--card-bg); border: 2px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s;
    position: relative;
  }
  .card.status-hot { border-color: var(--hot); background: linear-gradient(180deg, var(--hot-bg) 0%, var(--card-bg) 36%); }
  .card.status-med { border-color: var(--med); background: linear-gradient(180deg, var(--med-bg) 0%, var(--card-bg) 36%); }
  .card.status-skip { border-color: var(--skip); opacity: 0.5; }

  .badge-row {
    position: absolute; top: 8px; left: 8px; right: 8px; z-index: 2;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .badge {
    padding: 3px 8px; border-radius: 6px; font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .badge-brand { background: rgba(15, 23, 42, 0.85); color: #e2e8f0; border: 1px solid #475569; }
  .badge-new { background: #2563eb; color: #fff; }

  /* Dual Photo Split: Phone + Actual Replacement Part */
  .dual-img-wrap {
    display: grid; grid-template-columns: 1fr 1fr; height: 180px; background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .img-half {
    position: relative; display: flex; align-items: center; justify-content: center;
    padding: 8px 6px 18px; overflow: hidden; cursor: zoom-in;
  }
  .img-half:first-child { border-right: 1px solid #e2e8f0; }
  .img-half img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .img-caption {
    position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    font-size: 0.64rem; font-weight: 700; color: #475569; background: rgba(241,245,249,0.92);
    padding: 1px 7px; border-radius: 99px; white-space: nowrap;
  }

  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; flex: 1; gap: 9px; }
  .model-title { font-size: 1.04rem; font-weight: 800; color: #fff; line-height: 1.25; }
  .model-code { font-size: 0.76rem; color: var(--muted); font-weight: 500; margin-top: 2px; }

  /* Quality / Grade Selector Pills */
  .tiers-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 700; }
  .tiers-list { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  .tier-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 9px; border-radius: 8px; background: rgba(11, 17, 32, 0.65);
    border: 1px solid var(--border); cursor: pointer; font-size: 0.79rem; user-select: none;
  }
  .tier-item.selected {
    background: rgba(59, 130, 246, 0.22); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .tier-name { display: flex; align-items: center; gap: 7px; }
  .tier-check {
    width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #64748b;
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.68rem; flex-shrink: 0;
  }
  .tier-item.selected .tier-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tier-price { font-size: 0.75rem; color: #38bdf8; font-weight: 700; white-space: nowrap; margin-left: 6px; }
  body.hide-prices .tier-price { display: none; }

  /* Optional Quick Quantity & Shop Note (appears when rated Hot or Medium) */
  .extra-box {
    display: none; flex-direction: column; gap: 6px; padding-top: 4px;
    border-top: 1px dashed rgba(148,163,184,0.2);
  }
  .card.status-hot .extra-box, .card.status-med .extra-box { display: flex; }
  .qty-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .qty-lbl { font-size: 0.7rem; color: var(--muted); font-weight: 600; margin-right: 2px; }
  .qty-pill {
    padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
    background: #0b1120; border: 1px solid var(--border); color: #cbd5e1; cursor: pointer;
  }
  .qty-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note-input {
    width: 100%; background: rgba(11, 17, 32, 0.7); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; color: #fff; font-size: 0.76rem;
  }

  /* 3 Big Action Buttons */
  .rate-btns {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: auto; padding-top: 4px;
  }
  .r-btn {
    padding: 10px 4px; border-radius: 8px; border: 1px solid var(--border);
    background: #0b1120; color: #cbd5e1; font-size: 0.8rem; font-weight: 700;
    cursor: pointer; text-align: center; transition: 0.12s;
  }
  .r-btn.hot.active { background: var(--hot); border-color: var(--hot); color: #052e16; }
  .r-btn.med.active { background: var(--med); border-color: var(--med); color: #451a03; }
  .r-btn.skip.active { background: var(--skip); border-color: var(--skip); color: #fff; }

  /* Flashcard Mode */
  .flashcard-wrap {
    max-width: 500px; margin: 16px auto; display: none; flex-direction: column; gap: 12px;
  }
  body.flashcard-mode .grid, body.flashcard-mode .ref-section { display: none; }
  body.flashcard-mode .flashcard-wrap { display: flex; }
  .fc-nav { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.9rem; font-weight: 700; }

  /* Bottom Floating Export Bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(11, 17, 32, 0.96); border-top: 1px solid var(--border);
    padding: 12px 16px; backdrop-filter: blur(10px);
  }
  .bottom-inner { max-width: 1340px; width: 100%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .progress-text { font-size: 0.84rem; color: #e2e8f0; font-weight: 700; }
  .export-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-export {
    background: var(--hot); color: #052e16; border: none; padding: 10px 16px;
    border-radius: 8px; font-weight: 800; font-size: 0.84rem; cursor: pointer;
  }
  .btn-secondary {
    background: var(--card-bg); color: #fff; border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 0.84rem; cursor: pointer;
  }

  /* Summary Modal & Image Zoom Lightbox */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    max-width: 680px; width: 100%; max-height: 88vh; display: flex; flex-direction: column;
    padding: 18px; gap: 12px;
  }
  .modal textarea {
    width: 100%; height: 320px; background: #0b1120; color: #e2e8f0;
    border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.81rem;
  }
  .zoom-box {
    background: #fff; padding: 16px; border-radius: 14px; max-width: 92vw; max-height: 86vh;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .zoom-box img { max-width: 85vw; max-height: 72vh; object-fit: contain; }
  .zoom-caption { color: #0f172a; font-weight: 700; font-size: 0.95rem; text-align: center; }
</style>
</head>

      <button class="btn-secondary" onclick="copySummary()">📋 Copy Text</button>
      <button class="btn-export" onclick="shareWhatsApp()">📲 Send to WhatsApp</button>
    </div>
  </div>

<!-- Image Zoom Lightbox -->

  </div>
</div>

const STORAGE_KEY = 'somali_ethiopia_parts_survey_v2';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let currentCat = 'all';
let statusFilter = 'all';
let isFlashcard = false;
let refCollapsed = false;
let fcIndex = 0;

function makeFallbackSVG(label, isPart) {
  const icon = isPart ? '🔧' : '📱';
  const safe = label.replace(/[<>&"']/g, '');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="220" viewBox="0 0 240 220">
    <rect width="240" height="220" fill="#f8fafc"/>
    <rect x="65" y="22" width="110" height="150" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
    <text x="120" y="102" font-size="34" text-anchor="middle" font-family="sans-serif">${icon}</text>
    <text x="120" y="198" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle" font-family="sans-serif">${safe.slice(0,26)}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateCounts();
}

function getItemState(id) {
  if (!state[id]) state[id] = { status: '', tiers: {}, qty: '', note: '' };
  if (!state[id].tiers) state[id].tiers = {};
  return state[id];
}

function setRate(id, rate) {
  const st = getItemState(id);
  st.status = (st.status === rate) ? '' : rate;
  if ((st.status === 'hot' || st.status === 'med') && Object.keys(st.tiers).length === 0) {
    st.tiers[0] = true;
  }
  saveState();
  if (isFlashcard && st.status) {
    setTimeout(() => nextCard(), 160);
  } else {
    render();
  }
}

function toggleTier(id, idx) {
  const st = getItemState(id);
  if (st.tiers[idx]) delete st.tiers[idx];
  else st.tiers[idx] = true;
  if (!st.status && Object.keys(st.tiers).length > 0) {
    st.status = 'hot';
  }
  saveState();
  render();
}

function setQty(id, q) {
  const st = getItemState(id);
  st.qty = (st.qty === q) ? '' : q;
  saveState();
  render();
}

function setNote(id, val) {
  const st = getItemState(id);
  st.note = val;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function openZoom(src, caption) {
  document.getElementById('zoomImg').src = src;
  document.getElementById('zoomCap').textContent = caption;
  document.getElementById('zoomModal').classList.add('open');
}

function closeZoom() {
  document.getElementById('zoomModal').classList.remove('open');
}

function setCat(cat) {
  currentCat = cat;
  fcIndex = 0;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  render();
}

function setStatusFilter(sf) {
  statusFilter = (statusFilter === sf) ? 'all' : sf;
  fcIndex = 0;
  render();
}

function togglePrices() {
  document.body.classList.toggle('hide-prices');
  const hidden = document.body.classList.contains('hide-prices');
  const btn = document.getElementById('btnTogglePrice');
  btn.textContent = hidden ? '🔒 Prices Hidden' : '🔓 Prices Shown';
  btn.classList.toggle('active', !hidden);
}

function toggleMode() {
  isFlashcard = !isFlashcard;
  document.body.classList.toggle('flashcard-mode', isFlashcard);
  const btn = document.getElementById('btnToggleMode');
  btn.textContent = isFlashcard ? '🔲 Grid Mode' : '🃏 Flashcard Mode';
  btn.classList.toggle('active', isFlashcard);
  render();
}

function toggleRefBanner() {
  refCollapsed = !refCollapsed;
  renderRefBanner();
}

function resetAll() {
  if (confirm('Clear all ratings and notes and start fresh?')) {
    state = {};
    saveState();
    render();
  }
}

function getFilteredItems() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return ITEMS.filter(it => {
    if (currentCat !== 'all' && it.cat !== currentCat) return false;
    const st = getItemState(it.id);
    if (statusFilter === 'unrated') {
      if (st.status) return false;
    } else if (statusFilter !== 'all') {
      if (st.status !== statusFilter) return false;
    }
    if (q) {
      const tierNames = it.tiers.map(t => t.name).join(' ');
      const hay = (it.brand + ' ' + it.model + ' ' + it.code + ' ' + tierNames).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderRefBanner() {
  const wrap = document.getElementById('refBannerWrap');
  const guides = REF_GUIDES[currentCat];
  if (!guides || !guides.length) {
    wrap.innerHTML = '';
    return;
  }
  const cards = guides.map(g => {
    const safeTitle = g.title.replace(/['"]/g, '');
    return `
      <div class="ref-card">
        <img src="${g.img}" alt="${g.title}" onclick="openZoom(this.src, '${safeTitle}')"
             onerror="this.onerror=null;this.src=makeFallbackSVG('${safeTitle}',true)">
        <div>
          <h4>${g.title}</h4>
          <p>${g.desc}</p>
        </div>
      </div>
    `;
  }).join('');
  wrap.innerHTML = `
    <div class="ref-section ${refCollapsed ? 'collapsed' : ''}">
      <div class="ref-header" onclick="toggleRefBanner()">
        <span>📦 Visual Box & Quality Grade Reference Guide (Show Shop Owner)</span>
        <span>${refCollapsed ? '▼ Show Photos' : '▲ Hide Guide'}</span>
      </div>
      <div class="ref-grid">${cards}</div>
    </div>
  `;
}

function buildCardHTML(it) {
  const st = getItemState(it.id);
  const statusClass = st.status ? `status-${st.status}` : '';
  const partLabel = it.cat === 'iphone_bat' ? '🔋 Battery Part' : '🔧 Screen Part';
  const safeModel = it.model.replace(/['"]/g, '');

  const tiersHTML = it.tiers.map((t, idx) => {
    const sel = st.tiers && st.tiers[idx] ? 'selected' : '';
    const priceStr = t.cny === 'Pending' ? 'Quote Pending' : `¥${t.cny} ($${t.usd})`;
    return `
      <div class="tier-item ${sel}" onclick="toggleTier('${it.id}', ${idx})">
        <span class="tier-name">
          <span class="tier-check">${sel ? '✓' : ''}</span>
          <span>${t.name}</span>
        </span>
        <span class="tier-price">${priceStr}</span>
      </div>
    `;
  }).join('');

  const qtys = ['5 pcs', '10 pcs', '20 pcs', '50+ pcs'];
  const qtyHTML = qtys.map(q =>
    `<span class="qty-pill ${st.qty===q?'active':''}" onclick="setQty('${it.id}','${q}')">${q}</span>`
  ).join('');
  const safeNote = (st.note || '').replace(/"/g, '&quot;');

  return `
    <div class="card ${statusClass}">
      <div class="badge-row">
        <span class="badge badge-brand">${it.brand}</span>
        ${it.is_new ? '<span class="badge badge-new">Added Fast-Mover</span>' : ''}
      </div>
      <div class="dual-img-wrap">
        <div class="img-half" onclick="openZoom(this.querySelector('img').src, '${safeModel} — Phone Reference')">
          <img src="${it.phone_img}" alt="${it.model} phone" loading="lazy"
               onerror="this.onerror=null;this.src=makeFallbackSVG('${safeModel}',false)">
          <span class="img-caption">📱 Phone</span>
        </div>
        <div class="img-half" onclick="openZoom(this.querySelector('img').src, '${safeModel} — Replacement Part')">
          <img src="${it.part_img}" alt="${it.model} part" loading="lazy"
               onerror="this.onerror=null;this.src=makeFallbackSVG('${safeModel}',true)">
          <span class="img-caption">${partLabel}</span>
        </div>
      </div>
      <div class="card-body">
        <div>
          <div class="model-title">${it.model}</div>
          <div class="model-code">${it.code}</div>
        </div>
        <div>
          <div class="tiers-label">Tap Grade That Sells Here:</div>
          <div class="tiers-list">${tiersHTML}</div>
        </div>
        <div class="extra-box">
          <div class="qty-row">
            <span class="qty-lbl">Suggested Qty:</span>
            ${qtyHTML}
          </div>
          <input type="text" class="note-input" placeholder="💬 Shop note (e.g. '4G only', 'top seller')..."
                 value="${safeNote}" oninput="setNote('${it.id}', this.value)">
        </div>
        <div class="rate-btns">
          <button class="r-btn hot ${st.status==='hot'?'active':''}" onclick="setRate('${it.id}','hot')">🔥 Fast</button>
          <button class="r-btn med ${st.status==='med'?'active':''}" onclick="setRate('${it.id}','med')">👍 Medium</button>
          <button class="r-btn skip ${st.status==='skip'?'active':''}" onclick="setRate('${it.id}','skip')">❌ Skip</button>
        </div>
      </div>
    </div>
  `;
}

function updateCounts() {
  let hot = 0, med = 0, skip = 0;
  const catTotals = { all: ITEMS.length, iphone_lcd: 0, iphone_bat: 0, samsung_a: 0, samsung_s: 0, transsion: 0 };
  const catRated = { all: 0, iphone_lcd: 0, iphone_bat: 0, samsung_a: 0, samsung_s: 0, transsion: 0 };

  ITEMS.forEach(it => {
    catTotals[it.cat] = (catTotals[it.cat] || 0) + 1;
    const s = (state[it.id] && state[it.id].status) || '';
    if (s) {
      catRated.all++;
      catRated[it.cat] = (catRated[it.cat] || 0) + 1;
    }
    if (s === 'hot') hot++;
    else if (s === 'med') med++;
    else if (s === 'skip') skip++;
  });

  const unrated = ITEMS.length - (hot + med + skip);
  document.getElementById('cntHot').textContent = hot;
  document.getElementById('cntMed').textContent = med;
  document.getElementById('cntSkip').textContent = skip;
  document.getElementById('cntUnrated').textContent = unrated;

  ['hot','med','skip','unrated','all'].forEach(k => {
    const el = document.getElementById('pill_' + k);
    if (el) el.classList.toggle('active-filter', statusFilter === k && k !== 'all');
  });

  Object.keys(catTotals).forEach(cat => {
    const el = document.getElementById('tabCnt_' + cat);
    if (el) el.textContent = `${catRated[cat]}/${catTotals[cat]}`;
  });

  document.getElementById('progressText').textContent =
    `Rated: ${catRated.all} / ${ITEMS.length} models (🔥 ${hot} Fast • 👍 ${med} Medium • ⏳ ${unrated} Left)`;
}

function render() {
  updateCounts();
  renderRefBanner();
  const list = getFilteredItems();
  const grid = document.getElementById('cardsGrid');
  if (list.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:45px;">No models match your current filter. Click "Show All" to view everything.</div>';
  } else {
    grid.innerHTML = list.map(buildCardHTML).join('');
  }

  if (isFlashcard) {
    const slot = document.getElementById('fcSlot');
    const counter = document.getElementById('fcCounter');
    if (list.length === 0) {
      slot.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px;">No models match filter.</p>';
      counter.textContent = '0 / 0';
    } else {
      if (fcIndex >= list.length) fcIndex = 0;
      if (fcIndex < 0) fcIndex = list.length - 1;
      counter.textContent = `${fcIndex + 1} / ${list.length}`;
      slot.innerHTML = buildCardHTML(list[fcIndex]);
    }
  }
}

function nextCard() {
  const list = getFilteredItems();
  if (!list.length) return;
  if (fcIndex < list.length - 1) fcIndex++;
  else fcIndex = 0;
  render();
}

function prevCard() {
  const list = getFilteredItems();
  if (!list.length) return;
  if (fcIndex > 0) fcIndex--;
  else fcIndex = list.length - 1;
  render();
}

function generateSummaryText(includePrices) {
  const hotList = [];
  const medList = [];
  ITEMS.forEach(it => {
    const st = getItemState(it.id);
    if (st.status === 'hot' || st.status === 'med') {
      const chosenTiers = it.tiers
        .filter((_, idx) => st.tiers && st.tiers[idx])
        .map(t => includePrices && t.cny !== 'Pending' ? `${t.name} [¥${t.cny} / $${t.usd}]` : t.name);
      const tierStr = chosenTiers.length ? chosenTiers.join(' + ') : it.tiers.map(t => t.name).join(' / ');
      const qtyStr = st.qty ? ` | Qty: ${st.qty}` : '';
      const noteStr = st.note ? ` | Note: ${st.note}` : '';
      const line = `• [${it.brand}] ${it.model} (${it.code}) — ${tierStr}${qtyStr}${noteStr}`;
      if (st.status === 'hot') hotList.push(line);
      else medList.push(line);
    }
  });

  let out = `=== SOMALIA / ETHIOPIA SHOP SURVEY RESULTS ===\n`;
  out += `🔥 FAST MOVERS (MUST STOCK - ${hotList.length} Models):\n`;
  out += (hotList.length ? hotList.join('\n') : '(None selected yet)') + `\n\n`;
  out += `👍 MEDIUM MOVERS (SMALL STOCK - ${medList.length} Models):\n`;
  out += (medList.length ? medList.join('\n') : '(None selected yet)') + `\n`;
  return out;
}

function openSummaryModal() {
  const pricesCurrentlyVisible = !document.body.classList.contains('hide-prices');
  document.getElementById('chkExportPrices').checked = pricesCurrentlyVisible;
  refreshSummaryModal();
  document.getElementById('summaryModal').classList.add('open');
}

function refreshSummaryModal() {
  const showP = document.getElementById('chkExportPrices').checked;
  document.getElementById('summaryText').value = generateSummaryText(showP);
}

function closeSummaryModal() {
  document.getElementById('summaryModal').classList.remove('open');
}

function copySummary() {
  const ta = document.getElementById('summaryText');
  ta.select();
  navigator.clipboard.writeText(ta.value);
  alert('Copied! Paste directly into WhatsApp or Notes.');
}

function shareWhatsApp() {
  const text = document.getElementById('summaryText').value;
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function exportCSV() {
  let rows = [['Category','Model','Code','Shop Rating','Selected Quality Grades','Suggested Qty','Shop Note','Price (CNY)','Price (USD)']];
  ITEMS.forEach(it => {
    const st = getItemState(it.id);
    if (!st.status) return;
    const label = st.status === 'hot' ? 'FAST MOVER' : (st.status === 'med' ? 'MEDIUM' : 'SKIP');
    const chosen = it.tiers.filter((_, idx) => st.tiers && st.tiers[idx]);
    const tiersUsed = chosen.length ? chosen : it.tiers;
    rows.push([
      it.brand,
      it.model,
      it.code,
      label,
      tiersUsed.map(t => t.name).join(' + '),
      st.qty || '',
      st.note || '',
      tiersUsed.map(t => t.cny).join(' / '),
      tiersUsed.map(t => t.usd).join(' / ')
    ]);
  });
  const csvContent = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Shop_Veteran_Survey_Results.csv';
  a.click();
}

render();
</script>
